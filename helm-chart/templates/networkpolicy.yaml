{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudflare-dyndns.fullname" . }}
  labels:
    {{- include "cloudflare-dyndns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudflare-dyndns.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: http
  egress:
    # DNS
    - to:
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to the Cloudflare API (and any HTTPS proxy in front of it)
    - to:
      ports:
        - protocol: TCP
          port: 443
{{- end }}
