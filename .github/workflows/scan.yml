name: Scheduled image scan

# Nightly scan of the published `:latest` image so a newly-disclosed
# base-image CVE surfaces without needing a new commit.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Check that the image has been published
        run: |
          if docker manifest inspect "ghcr.io/${REPO_OWNER}/cloudflare-dyndns:latest" > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::ghcr.io/${REPO_OWNER}/cloudflare-dyndns:latest does not exist yet; skipping the scan"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.image.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_OWNER }}/cloudflare-dyndns:latest
          severity: HIGH,CRITICAL
          # Debian security fixes lag upstream disclosure for many packages, so
          # without this Trivy floods Code Scanning with CVEs that have no
          # available fix yet.
          ignore-unfixed: true
          # Otherwise the SARIF output ignores `severity` and uploads every level.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image-results.sarif
      # SARIF upload needs a public repo or GHAS.
      - if: always() && steps.image.outputs.exists == 'true' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image-results.sarif
