name: Release

# Publishing happens ONLY here, and ONLY on:
#   - push to main            -> image tags `edge`, `sha-<short-sha>`
#   - a `v*` tag               -> image tags `X.Y.Z`, `X.Y`, `X`, `latest`
#                                  + Helm chart push + GitHub Release
# A push to any other branch never publishes anything (fixes the old
# docker-build-push.yml / helmchart-push.yml running on `push:` with no
# ref filter, which let any branch push overwrite the public `:latest`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/cloudflare-dyndns
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${REPO_OWNER}/cloudflare-dyndns@${{ steps.build.outputs.digest }}"

  chart:
    name: Package & push Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [image]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - uses: azure/setup-helm@v4

      - run: |
          helm package helm-chart \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination /tmp/chart

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - run: helm push "/tmp/chart/cloudflare-dyndns-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/${REPO_OWNER}/charts"

      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes "/tmp/chart/cloudflare-dyndns-${{ steps.version.outputs.version }}.tgz" --output-signature "/tmp/chart/cloudflare-dyndns-${{ steps.version.outputs.version }}.tgz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/chart/

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/chart
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: /tmp/chart/*
